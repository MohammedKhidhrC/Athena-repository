<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Athena — AI Computer Simulator</title>
<style>
body{margin:0;font-family:Inter,system-ui;background:#0b1020;color:#eef2ff}main{max-width:1100px;margin:auto;padding:32px}.card{background:#121a2e;border:1px solid #273454;border-radius:16px;padding:22px;margin:16px 0}h1{margin-bottom:6px}textarea{width:100%;box-sizing:border-box;min-height:90px;background:#080d19;color:white;border:1px solid #334263;border-radius:10px;padding:14px;font-size:16px}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#6d7cff;color:white;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}.screen{height:360px;background:#dfe5ed;border-radius:12px;color:#172033;position:relative;overflow:hidden}.bar{height:34px;background:#26334d;color:white;padding:0 12px;display:flex;align-items:center}.window{background:white;width:72%;height:55%;position:absolute;left:14%;top:22%;box-shadow:0 10px 30px #0004}.title{background:#31415e;color:white;padding:8px}.content{padding:18px;font-family:monospace}.cursor{position:absolute;font-size:22px;display:none}.log{font-family:monospace;white-space:pre-wrap;line-height:1.6}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#1d2a49;color:#aab8ff}
</style></head>
<body><main><div class="card"><span class="pill">SAFE WEB DEMO</span><h1>Athena — AI Computer Simulator</h1><p>Describe a computer task and watch Athena understand, plan, execute and verify it. Nothing on your real computer is controlled.</p><textarea id="task">Open Notepad and type Hello Athena</textarea><button onclick="run()">Run simulation</button></div><div class="grid"><div class="card"><h2>Virtual desktop</h2><div class="screen" id="screen"><div class="bar">Windows Desktop</div><div class="window" id="win" style="display:none"><div class="title">Notepad</div><div class="content" id="text"> </div></div><div class="cursor" id="cursor">➤</div></div></div><div class="card"><h2>Agent log</h2><div class="log" id="log">Ready. Waiting for a task…</div></div></div></main>
<script>
const log=e=>document.getElementById('log').textContent+=`\n${e}`;
async function run(){const task=document.getElementById('task').value;document.getElementById('log').textContent='';document.getElementById('win').style.display='none';document.getElementById('text').textContent='';log('🧠 Understanding task…');await wait(500);log('👁 Observing virtual desktop…');await wait(500);const r=await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task})});const d=await r.json();if(!d.ok){log('❌ '+d.error);return}log('📋 '+d.steps[2].message);await wait(500);for(const a of d.actions){if(a.action==='open'){log('▶ OPEN '+a.target);document.getElementById('win').style.display='block';await wait(700)}if(a.action==='type'){log('▶ TYPE '+a.text);document.getElementById('text').textContent=a.text;await wait(700)}if(a.action==='click'){log('▶ CLICK '+a.target);await wait(500)}}log('🔎 Verifying result…');await wait(500);log('✅ Simulation complete — real computer untouched.')}function wait(ms){return new Promise(r=>setTimeout(r,ms))}
</script></body></html>
